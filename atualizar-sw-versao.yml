name: Atualizar versão do sw.js

# Roda toda vez que o index.html mudar na branch main (upload manual pelo
# GitHub, git push, edição pelo site — não importa como chegou o commit).
# Como só reage a mudanças em index.html, o commit que ele mesmo faz
# (mexendo só no sw.js) não dispara o workflow de novo — sem loop infinito.
on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'

permissions:
  contents: write

jobs:
  bump-sw-version:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Gerar novo carimbo de versão e atualizar sw.js
        run: |
          BUILD_ID=$(date -u +%Y%m%d%H%M%S)
          if [ ! -f "sw.js" ]; then
            echo "Não encontrei sw.js na raiz do repositório."
            exit 1
          fi
          sed -i -E "s/(const CACHE_NAME = 'caixa-gv-)[^']+(';)/\1${BUILD_ID}\2/" sw.js
          echo "sw.js atualizado para caixa-gv-${BUILD_ID}"

      - name: Commitar e enviar a alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sw.js
          if git diff --cached --quiet; then
            echo "Nada mudou no sw.js, nada para commitar."
          else
            git commit -m "chore: atualizar versão do sw.js automaticamente"
            git push
          fi
